; AIMsisters - PHP upload limits.
;
; Large media (video/audio/PDF, e.g. a ~2 hour sermon/documentary) uploads
; through the admin Upload Content page via ChunkUploadController, split
; into small pieces (CHUNK_SIZE_MB, default 8MB - see Backend/config/
; config.php) — each individual HTTP request only ever carries ONE chunk,
; so these values only need to comfortably fit one chunk plus a little
; multipart overhead, not the whole multi-GB file. That's the point: a
; single-shot upload of a full video would need upload_max_filesize/
; post_max_size in the multiple-gigabytes range, which most hosting
; doesn't allow you to configure at all - chunking removes that
; requirement entirely rather than needing ever-larger ini values.
;
; The plain single-shot /api/upload endpoint (thumbnails, small files, the
; Media Library page) still uses these same limits directly and is not
; chunked - that's fine, those files are always small.
;
; Honored by both mod_php and CGI/FastCGI (unlike php_value in .htaccess,
; which only works under mod_php and would 500 error under CGI/FastCGI) -
; safe for both a typical XAMPP/mod_php install and most shared hosting.
; Apache/PHP-FPM re-read .user.ini files periodically (user_ini.cache_ttl,
; default 300s) rather than instantly, so restart Apache after editing
; this if a change doesn't seem to take effect. If neither this nor
; .htaccess's redundant copy takes effect on your setup, edit your real
; php.ini directly (same directives) and restart Apache - that always works.
;
; ChunkUploadController::finalize() (which assembles all the chunks back
; into one file) raises its own execution time limit for just that one
; request via set_time_limit() when it runs, rather than needing a large
; max_execution_time set globally here for every request.

upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
