; AIMsisters - PHP upload limits for large media (e.g. a ~2 hour sermon/
; documentary video, several GB). Honored by both mod_php and CGI/FastCGI
; (unlike php_value in .htaccess, which only works under mod_php and would
; 500 error under CGI/FastCGI) - safe for both a typical XAMPP/mod_php
; install and most shared hosting. Apache/PHP-FPM re-reads .user.ini files
; periodically (user_ini.cache_ttl, default 300s) rather than instantly, so
; restart Apache after editing this if a change doesn't seem to take effect.
;
; These caps must be >= Backend/config/config.php's MAX_UPLOAD_SIZE_MB (see
; MAX_UPLOAD_SIZE_MB in .env) - PHP itself will reject anything over these
; ini limits before the application ever sees the request, regardless of
; what MAX_UPLOAD_SIZE_MB says. UploadController reports a specific,
; actionable error when that happens rather than a generic failure.
;
; Note: this only controls PHP. Apache's own Timeout directive (httpd.conf,
; default 300s) can still drop a very slow upload before PHP sees it - not
; usually an issue testing locally over loopback, but worth knowing if this
; is ever deployed somewhere with a slow real network path to the server.

upload_max_filesize = 8192M
post_max_size = 8200M
max_execution_time = 3600
max_input_time = 3600
memory_limit = 512M
